model:
  provider: longcat
  model: LongCat-2.0-Preview
  temperature: 0.7
  max_tokens: 4096
  max_retries: 3
  timeout: 60

memory:
  enabled: true
  path: ./data/memory
  max_items: 10000
  vector_embedding_provider: local
  embedding_dim: 1536
  similarity_threshold: 0.7

tools:
  default_profile: coding
  sandbox_enabled: false
  workspace_root: null
  allowed_paths: null
  denied_paths: null
  require_approval:
    - terminal_run
    - exec

windows:
  enabled: true
  screenshot_path: ./data/screenshots
  keyboard_delay: 0.05
  mouse_delay: 0.1

max_iterations: 50
agent_id: openhands-agent

system_prompt: |
  You are OpenHands, a powerful AI assistant with versatile capabilities.

  Your abilities:
  - Control mouse and keyboard (on Windows)
  - View and manage windows
  - Capture screenshots
  - Execute terminal commands
  - Read and write files
  - Remember important information
  - Perform multimodal interactions

  Always be helpful, safe, and explain your actions.
