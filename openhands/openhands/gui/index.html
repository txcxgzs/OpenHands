<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenHands - AI 智能助手控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
        }
        
        /* 侧边栏 */
        .sidebar {
            width: 240px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 600;
        }
        
        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }
        
        .nav-group {
            margin-bottom: 5px;
        }
        
        .nav-group-title {
            padding: 10px 20px 5px;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }
        
        .nav-item:hover {
            background: var(--bg-hover);
        }
        
        .nav-item.active {
            background: rgba(99, 102, 241, 0.1);
            border-left-color: var(--primary);
            color: var(--primary);
        }
        
        .nav-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        
        .nav-badge {
            margin-left: auto;
            background: var(--primary);
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
        }
        
        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* 顶部栏 */
        .top-bar {
            height: 60px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        
        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .page-title {
            font-size: 18px;
            font-weight: 500;
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(34, 197, 94, 0.1);
            border-radius: 20px;
            font-size: 13px;
            color: var(--success);
        }
        
        .connection-status.disconnected {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        
        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
        }
        
        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        
        .btn-secondary:hover {
            background: var(--border);
        }
        
        /* 内容区域 */
        .content-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        /* 聊天区域 */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        
        .message.user .message-avatar {
            background: var(--primary);
        }
        
        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }
        
        .message-content {
            flex: 1;
        }
        
        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        
        .message-name {
            font-weight: 500;
        }
        
        .message-time {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .message-text {
            line-height: 1.6;
            color: var(--text-primary);
        }
        
        .message-text pre {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 10px 0;
        }
        
        .message-text code {
            background: var(--bg-card);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
        }
        
        /* 工具调用卡片 */
        .tool-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .tool-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(99, 102, 241, 0.1);
            cursor: pointer;
        }
        
        .tool-icon {
            width: 24px;
            height: 24px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .tool-name {
            font-weight: 500;
            flex: 1;
        }
        
        .tool-status {
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
        }
        
        .tool-status.running {
            background: rgba(59, 130, 246, 0.2);
            color: var(--info);
        }
        
        .tool-status.success {
            background: rgba(34, 197, 94, 0.2);
            color: var(--success);
        }
        
        .tool-status.error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }
        
        .tool-body {
            padding: 12px;
            display: none;
        }
        
        .tool-card.expanded .tool-body {
            display: block;
        }
        
        .tool-params {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .tool-result {
            margin-top: 10px;
            padding: 10px;
            background: var(--bg-dark);
            border-radius: 6px;
            font-size: 13px;
        }
        
        /* 输入区域 */
        .input-area {
            padding: 20px;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
        }
        
        .input-container {
            display: flex;
            gap: 10px;
        }
        
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        
        .message-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 50px;
            max-height: 150px;
        }
        
        .message-input:focus {
            border-color: var(--primary);
        }
        
        .send-btn {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .send-btn:hover {
            background: var(--primary-dark);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 右侧面板 */
        .right-panel {
            width: 300px;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        
        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }
        
        .panel-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }
        
        .panel-tab:hover {
            background: var(--bg-hover);
        }
        
        .panel-tab.active {
            border-bottom-color: var(--primary);
            color: var(--primary);
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        .stat-card {
            background: var(--bg-dark);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 24px;
            font-weight: 600;
        }
        
        .activity-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .activity-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .activity-content {
            flex: 1;
        }
        
        .activity-title {
            font-size: 13px;
            margin-bottom: 2px;
        }
        
        .activity-time {
            font-size: 11px;
            color: var(--text-secondary);
        }
        
        /* 设置面板 */
        .settings-group {
            margin-bottom: 20px;
        }
        
        .settings-title {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }
        
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--bg-dark);
            border-radius: 6px;
            margin-bottom: 5px;
        }
        
        .settings-label {
            font-size: 14px;
        }
        
        .settings-input {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 10px;
            color: var(--text-primary);
            font-size: 13px;
            width: 150px;
        }
        
        /* 加载动画 */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }
        
        /* 欢迎消息 */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
        }
        
        .welcome-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }
        
        .welcome-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .welcome-desc {
            color: var(--text-secondary);
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->

        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">🤚</div>
                <span>OpenHands</span>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <!-- 对话组 -->
            <div class="nav-group">
                <div class="nav-group-title">对话</div>

            </div>
            
            <!-- 控制组 -->
            <div class="nav-group">
                <div class="nav-group-title">控制</div>
                <div class="nav-item" data-tab="overview">
                    <span class="nav-icon">📊</span>
                    <span>概览</span>
                </div>
                <div class="nav-item" data-tab="channels">
                    <span class="nav-icon">🔗</span>
                    <span>渠道</span>
                </div>
                <div class="nav-item" data-tab="instances">
                    <span class="nav-icon">📡</span>
                    <span>实例</span>
                </div>
                <div class="nav-item" data-tab="sessions">
                    <span class="nav-icon">📄</span>
                    <span>会话</span>
                </div>
                <div class="nav-item" data-tab="usage">
                    <span class="nav-icon">📈</span>
                    <span>用量</span>
                </div>
                <div class="nav-item" data-tab="cron">
                    <span class="nav-icon">⏰</span>
                    <span>定时任务</span>
                </div>
            </div>
            
            <!-- 智能体组 -->
            <div class="nav-group">
                <div class="nav-group-title">智能体</div>
                <div class="nav-item" data-tab="agents">
                    <span class="nav-icon">📁</span>
                    <span>智能体管理</span>
                </div>
                <div class="nav-item" data-tab="skills">
                    <span class="nav-icon">⚡</span>
                    <span>技能</span>
                </div>
                <div class="nav-item" data-tab="nodes">
                    <span class="nav-icon">🖥️</span>
                    <span>节点</span>
                </div>
                <div class="nav-item" data-tab="dreams">
                    <span class="nav-icon">🌙</span>
                    <span>学习反思</span>
                </div>
            </div>
            
            <!-- 设置组 -->
            <div class="nav-group">
                <div class="nav-group-title">设置</div>
                <div class="nav-item" data-tab="config">
                    <span class="nav-icon">⚙️</span>
                    <span>配置</span>
                </div>
                <div class="nav-item" data-tab="appearance">
                    <span class="nav-icon">✨</span>
                    <span>外观</span>
                </div>
                <div class="nav-item" data-tab="automation">
                    <span class="nav-icon">🔧</span>
                    <span>自动化</span>
                </div>
                <div class="nav-item" data-tab="logs">
                    <span class="nav-icon">📜</span>
                    <span>日志</span>
                </div>
            </div>
        </nav>
    </div>
    
    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 顶部栏 -->
        <div class="top-bar">
            <div class="top-bar-left">
                <h1 class="page-title">聊天</h1>
                <div class="connection-status" id="connectionStatus">
                    <span class="status-dot"></span>
                    <span>已连接</span>
                </div>
            </div>
            <div class="top-bar-right">
                <button class="btn btn-secondary" onclick="clearChat()">🗑️ 清空</button>
                <button class="btn btn-primary" onclick="takeControl()">🎮 接管控制</button>
            </div>
        </div>
        
        <!-- 内容区域 -->
        <div class="content-area">
            <!-- 聊天区域 -->
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <!-- 欢迎消息 -->
                    <div class="welcome-message">
                        <div class="welcome-icon">🤚</div>
                        <h2 class="welcome-title">欢迎使用 OpenHands</h2>
                        <p class="welcome-desc">
                            我是您的 AI 智能助手，可以帮您操作电脑、管理文件、执行命令等。
                            请输入您的需求开始对话。
                        </p>
                    </div>
                </div>
                
                <!-- 输入区域 -->
                <div class="input-area">
                    <div class="input-container">
                        <div class="input-wrapper">
                            <textarea 
                                class="message-input" 
                                id="messageInput" 
                                placeholder="输入消息... (按 Enter 发送，Shift+Enter 换行)"
                                rows="1"
                            ></textarea>
                        </div>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                            发送 ➤
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 右侧面板 -->
            <div class="right-panel">
                <div class="panel-tabs">
                    <div class="panel-tab active" data-panel="stats">统计</div>
                    <div class="panel-tab" data-panel="activity">活动</div>
                    <div class="panel-tab" data-panel="settings">设置</div>
                </div>
                
                <div class="panel-content" id="panelContent">
                    <!-- 统计面板 -->
                    <div id="statsPanel">
                        <div class="stat-card">
                            <div class="stat-label">工具调用次数</div>
                            <div class="stat-value" id="toolCallCount">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">消息数量</div>
                            <div class="stat-value" id="messageCount">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">会话时长</div>
                            <div class="stat-value" id="sessionDuration">00:00</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">当前模型</div>
                            <div class="stat-value" id="currentModel" style="font-size: 14px;">LongCat-2.0</div>
                        </div>
                    </div>
                    
                    <!-- 活动面板 -->
                    <div id="activityPanel" style="display: none;">
                        <div id="activityList">
                            <!-- 活动项会动态添加 -->
                        </div>
                    </div>
                    
                    <!-- 设置面板 -->
                    <div id="settingsPanel" style="display: none;">
                        <div class="settings-group">
                            <div class="settings-title">API 配置</div>
                            <div class="settings-item">
                                <span class="settings-label">API 密钥</span>
                                <input type="password" class="settings-input" id="apiKeyInput" placeholder="sk-...">
                            </div>
                            <div class="settings-item">
                                <span class="settings-label">模型</span>
                                <select class="settings-input" id="modelSelect">
                                    <option value="LongCat-2.0-Preview">LongCat-2.0</option>
                                    <option value="claude-3-5-sonnet">Claude 3.5</option>
                                    <option value="gpt-4o">GPT-4o</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="settings-group">
                            <div class="settings-title">行为设置</div>
                            <div class="settings-item">
                                <span class="settings-label">自动滚动</span>
                                <input type="checkbox" id="autoScroll" checked>
                            </div>
                            <div class="settings-item">
                                <span class="settings-label">显示工具调用</span>
                                <input type="checkbox" id="showToolCalls" checked>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let messageCount = 0;
        let toolCallCount = 0;
        let sessionStartTime = Date.now();
        let activities = [];
        
        // 初始化 WebSocket 连接
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            updateConnectionStatus('connecting');
            addActivity('系统', '正在连接服务器...', '🔗');
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                updateConnectionStatus('connected');
                addActivity('系统', '已连接到服务器', '✅');
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket 错误:', error);
                updateConnectionStatus('disconnected');
                addActivity('系统', '连接错误', '❌');
            };
            
            ws.onclose = () => {
                updateConnectionStatus('disconnected');
                addActivity('系统', '连接已断开', '⚠️');
                // 5秒后重连
                setTimeout(initWebSocket, 5000);
            };
        }
        
        // 更新连接状态
        function updateConnectionStatus(status) {
            const statusEl = document.getElementById('connectionStatus');
            if (status === 'connected') {
                statusEl.className = 'connection-status';
                statusEl.innerHTML = '<span class="status-dot"></span><span>已连接</span>';
            } else if (status === 'connecting') {
                statusEl.className = 'connection-status';
                statusEl.innerHTML = '<span class="status-dot"></span><span>连接中...</span>';
            } else {
                statusEl.className = 'connection-status disconnected';
                statusEl.innerHTML = '<span class="status-dot"></span><span>未连接</span>';
            }
        }
        
        // 处理消息
        function handleMessage(data) {
            switch (data.type) {
                case 'message':
                    addMessage('assistant', data.content);
                    break;
                case 'status':
                    showStatus(data.content);
                    break;
                case 'tool_call':
                    showToolCall(data.tool, data.arguments);
                    toolCallCount++;
                    updateStats();
                    break;
                case 'tool_result':
                    showToolResult(data.tool, data.result, data.is_error);
                    break;
                case 'error':
                    addMessage('assistant', '❌ 错误: ' + data.content, true);
                    break;
            }
        }
        
        // 添加消息
        function addMessage(role, content, isError = false) {
            const messagesEl = document.getElementById('chatMessages');
            
            // 移除欢迎消息
            const welcome = messagesEl.querySelector('.welcome-message');
            if (welcome) welcome.remove();
            
            // 移除加载指示器
            const typing = messagesEl.querySelector('.typing-indicator');
            if (typing) typing.remove();
            
            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;
            
            const avatar = role === 'user' ? '👤' : '🤖';
            const name = role === 'user' ? '您' : 'OpenHands';
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            messageEl.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-name">${name}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-text" style="${isError ? 'color: var(--error);' : ''}">${formatContent(content)}</div>
                </div>
            `;
            
            messagesEl.appendChild(messageEl);
            
            if (document.getElementById('autoScroll').checked) {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }
            
            messageCount++;
            updateStats();
            addActivity(name, content.substring(0, 50) + (content.length > 50 ? '...' : ''), avatar);
        }
        
        // 格式化内容
        function formatContent(content) {
            // 简单的 Markdown 支持
            return content
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }
        
        // 显示状态
        function showStatus(status) {
            const messagesEl = document.getElementById('chatMessages');
            
            // 移除旧的状态
            const oldStatus = messagesEl.querySelector('.status-message');
            if (oldStatus) oldStatus.remove();
            
            const statusEl = document.createElement('div');
            statusEl.className = 'status-message';
            statusEl.style.cssText = 'text-align: center; padding: 10px; color: var(--text-secondary); font-size: 13px;';
            statusEl.textContent = status;
            
            messagesEl.appendChild(statusEl);
            
            if (document.getElementById('autoScroll').checked) {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }
        }
        
        // 显示工具调用
        function showToolCall(tool, args) {
            if (!document.getElementById('showToolCalls').checked) return;
            
            const messagesEl = document.getElementById('chatMessages');
            
            const toolEl = document.createElement('div');
            toolEl.className = 'tool-card';
            toolEl.innerHTML = `
                <div class="tool-header" onclick="toggleTool(this)">
                    <div class="tool-icon">🔧</div>
                    <span class="tool-name">${tool}</span>
                    <span class="tool-status running">执行中...</span>
                </div>
                <div class="tool-body">
                    <div class="tool-params"><strong>参数:</strong> ${JSON.stringify(args, null, 2)}</div>
                </div>
            `;
            
            messagesEl.appendChild(toolEl);
            
            if (document.getElementById('autoScroll').checked) {
                messagesEl.scrollTop = messagesEl.scrollHeight;
            }
        }
        
        // 显示工具结果
        function showToolResult(tool, result, isError) {
            const messagesEl = document.getElementById('chatMessages');
            const toolCards = messagesEl.querySelectorAll('.tool-card');
            
            if (toolCards.length > 0) {
                const lastCard = toolCards[toolCards.length - 1];
                const statusEl = lastCard.querySelector('.tool-status');
                const bodyEl = lastCard.querySelector('.tool-body');
                
                statusEl.className = `tool-status ${isError ? 'error' : 'success'}`;
                statusEl.textContent = isError ? '失败' : '成功';
                
                const resultEl = document.createElement('div');
                resultEl.className = 'tool-result';
                resultEl.innerHTML = `<strong>结果:</strong><br>${result}`;
                bodyEl.appendChild(resultEl);
            }
        }
        
        // 切换工具卡片展开
        function toggleTool(header) {
            const card = header.parentElement;
            card.classList.toggle('expanded');
        }
        
        // 发送消息
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('未连接到服务器，请稍候...');
                return;
            }
            
            addMessage('user', content);
            
            ws.send(JSON.stringify({
                type: 'message',
                content: content
            }));
            
            input.value = '';
            
            // 显示加载指示器
            showTypingIndicator();
        }
        
        // 显示加载指示器
        function showTypingIndicator() {
            const messagesEl = document.getElementById('chatMessages');
            
            const typingEl = document.createElement('div');
            typingEl.className = 'message assistant';
            typingEl.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            
            messagesEl.appendChild(typingEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        // 清空聊天
        function clearChat() {
            const messagesEl = document.getElementById('chatMessages');
            messagesEl.innerHTML = `
                <div class="welcome-message">
                    <div class="welcome-icon">🤚</div>
                    <h2 class="welcome-title">欢迎使用 OpenHands</h2>
                    <p class="welcome-desc">
                        我是您的 AI 智能助手，可以帮您操作电脑、管理文件、执行命令等。
                        请输入您的需求开始对话。
                    </p>
                </div>
            `;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'clear' }));
            }
            
            messageCount = 0;
            toolCallCount = 0;
            updateStats();
        }
        
        // 接管控制
        function takeControl() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'take_control' }));
                addActivity('系统', '已请求接管控制权', '🎮');
            }
        }
        
        // 更新统计
        function updateStats() {
            document.getElementById('toolCallCount').textContent = toolCallCount;
            document.getElementById('messageCount').textContent = messageCount;
        }
        
        // 添加活动
        function addActivity(title, desc, icon) {
            const activityList = document.getElementById('activityList');
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            activities.unshift({ title, desc, icon, time });
            if (activities.length > 50) activities.pop();
            
            const activityEl = document.createElement('div');
            activityEl.className = 'activity-item';
            activityEl.innerHTML = `
                <div class="activity-icon" style="background: var(--bg-hover);">${icon}</div>
                <div class="activity-content">
                    <div class="activity-title">${title}</div>
                    <div class="activity-time">${time} - ${desc}</div>
                </div>
            `;
            
            activityList.insertBefore(activityEl, activityList.firstChild);
            
            // 限制显示数量
            while (activityList.children.length > 20) {
                activityList.removeChild(activityList.lastChild);
            }
        }
        
        // 更新会话时长
        function updateSessionDuration() {
            const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('sessionDuration').textContent = `${minutes}:${seconds}`;
        }
        
        // 切换面板
        document.querySelectorAll('.panel-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                const panel = tab.dataset.panel;
                document.getElementById('statsPanel').style.display = panel === 'stats' ? 'block' : 'none';
                document.getElementById('activityPanel').style.display = panel === 'activity' ? 'block' : 'none';
                document.getElementById('settingsPanel').style.display = panel === 'settings' ? 'block' : 'none';
            });
        });
        
        // 切换侧边栏标签
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                
                const tab = item.dataset.tab;
                document.querySelector('.page-title').textContent = item.querySelector('span:last-child').textContent;
            });
        });
        
        // 输入框事件
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // 自动调整输入框高度
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });
        
        // 初始化
        initWebSocket();
        setInterval(updateSessionDuration, 1000);
    </script>
</body>
</html>
