<!DOCTYPE html>
<html lang="zh-CN" data-theme-mode="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenHands - AI 智能助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* OpenClaw Dark Theme */
            --bg: #0e1015;
            --bg-accent: #13151b;
            --bg-elevated: #191c24;
            --bg-hover: #1f2330;
            --bg-muted: #1f2330;
            --card: #161920;
            --card-foreground: #f0f0f2;
            --popover: #191c24;
            --text: #d4d4d8;
            --text-strong: #f4f4f5;
            --chat-text: #d4d4d8;
            --muted: #838387;
            --border: #1e2028;
            --border-strong: #2e3040;
            --accent: #ff5c5c;
            --accent-hover: #ff7070;
            --accent-muted: #ff5c5c;
            --accent-subtle: rgba(255, 92, 92, 0.1);
            --accent-foreground: #fafafa;
            --ok: #22c55e;
            --warn: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --secondary: #161920;
            --secondary-foreground: #f0f0f2;
            --radius: 10px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        
        /* Layout */
        .app {
            display: flex;
            height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 240px;
            background: var(--bg-accent);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #ff7070);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(255, 92, 92, 0.3);
        }
        
        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-strong);
        }
        
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
        }
        
        .nav-group {
            margin-bottom: 8px;
        }
        
        .nav-group-title {
            padding: 8px 12px 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s ease;
            color: var(--text);
            font-size: 14px;
            border-left: 3px solid transparent;
            margin: 2px 0;
        }
        
        .nav-item:hover {
            background: var(--bg-hover);
        }
        
        .nav-item.active {
            background: var(--accent-subtle);
            border-left-color: var(--accent);
            color: var(--accent);
        }
        
        .nav-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }
        
        .nav-badge {
            margin-left: auto;
            background: var(--accent);
            color: white;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 999px;
        }
        
        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }
        
        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-accent);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-strong);
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .connection-status.connected {
            background: rgba(34, 197, 94, 0.1);
            color: var(--ok);
        }
        
        .connection-status.disconnected {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        
        .header-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary {
            background: var(--accent);
            color: var(--accent-foreground);
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 12px rgba(255, 92, 92, 0.3);
        }
        
        .btn-ghost {
            background: transparent;
            color: var(--text);
        }
        
        .btn-ghost:hover {
            background: var(--bg-hover);
        }
        
        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 0 6px 6px;
        }
        
        .chat-thread {
            flex: 1;
            overflow-y: auto;
            padding: 0 18px;
        }
        
        /* Welcome Screen */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 24px;
            flex: 1;
            min-height: 0;
        }
        
        .welcome-icon {
            width: 64px;
            height: 64px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        
        .welcome h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-strong);
            margin-bottom: 8px;
        }
        
        .welcome p {
            font-size: 14px;
            color: var(--muted);
            max-width: 500px;
            line-height: 1.6;
        }
        
        /* Messages */
        .message {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        
        .message.user .message-avatar {
            background: var(--accent);
        }
        
        .message.assistant .message-avatar {
            background: linear-gradient(135deg, var(--ok), #16a34a);
        }
        
        .message-content {
            flex: 1;
            min-width: 0;
        }
        
        .message-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 6px;
        }
        
        .message-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-strong);
        }
        
        .message-time {
            font-size: 11px;
            color: var(--muted);
        }
        
        .message-text {
            font-size: 14px;
            line-height: 1.6;
            color: var(--chat-text);
        }
        
        .message-text pre {
            background: var(--card);
            padding: 12px 14px;
            border-radius: var(--radius-md);
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid var(--border);
        }
        
        .message-text code {
            background: var(--card);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 13px;
            border: 1px solid var(--border);
        }
        
        .message-text pre code {
            background: transparent;
            border: none;
            padding: 0;
        }
        
        /* Tool Cards */
        .tool-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin: 12px 0;
            overflow: hidden;
        }
        
        .tool-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--accent-subtle);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        
        .tool-header:hover {
            background: rgba(255, 92, 92, 0.15);
        }
        
        .tool-icon {
            width: 24px;
            height: 24px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .tool-name {
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font-mono);
            color: var(--text-strong);
            flex: 1;
        }
        
        .tool-status {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 999px;
        }
        
        .tool-status.running {
            background: rgba(59, 130, 246, 0.2);
            color: var(--info);
        }
        
        .tool-status.success {
            background: rgba(34, 197, 94, 0.2);
            color: var(--ok);
        }
        
        .tool-status.error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }
        
        .tool-body {
            padding: 12px 14px;
            display: none;
            font-size: 13px;
            color: var(--muted);
        }
        
        .tool-card.expanded .tool-body {
            display: block;
        }
        
        .tool-result {
            margin-top: 10px;
            padding: 10px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text);
            max-height: 200px;
            overflow-y: auto;
        }
        
        /* Compose Area */
        .compose {
            flex-shrink: 0;
            padding: 12px 4px 4px;
            background: linear-gradient(to bottom, transparent, var(--bg) 20%);
        }
        
        .compose-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            transition: all 0.15s ease;
        }
        
        .compose-box:focus-within {
            border-color: var(--border-strong);
            box-shadow: 0 0 0 3px rgba(255, 92, 92, 0.1);
        }
        
        .compose-field {
            display: flex;
            align-items: stretch;
        }
        
        .compose-input {
            flex: 1;
            padding: 12px 14px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 14px;
            font-family: var(--font-body);
            line-height: 1.4;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 150px;
        }
        
        .compose-input::placeholder {
            color: var(--muted);
        }
        
        .compose-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-top: 1px solid var(--border);
        }
        
        .send-btn {
            padding: 0 16px;
            height: 32px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .send-btn:hover:not(:disabled) {
            background: var(--accent-hover);
            box-shadow: 0 4px 12px rgba(255, 92, 92, 0.3);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Typing Indicator */
        .typing {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 0;
        }
        
        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--muted);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-8px);
            }
        }
        
        /* Right Panel */
        .right-panel {
            width: 300px;
            background: var(--bg-accent);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }
        
        .panel-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s ease;
        }
        
        .panel-tab:hover {
            color: var(--text);
            background: var(--bg-hover);
        }
        
        .panel-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-strong);
        }
        
        .activity-item {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .activity-item:last-child {
            border-bottom: none;
        }
        
        .activity-icon {
            width: 28px;
            height: 28px;
            background: var(--bg-hover);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        
        .activity-content {
            flex: 1;
            min-width: 0;
        }
        
        .activity-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 2px;
        }
        
        .activity-time {
            font-size: 11px;
            color: var(--muted);
        }
        
        /* Settings */
        .settings-group {
            margin-bottom: 16px;
        }
        
        .settings-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: var(--card);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            border: 1px solid var(--border);
        }
        
        .settings-label {
            font-size: 13px;
            color: var(--text);
        }
        
        .settings-input {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 5px 8px;
            color: var(--text);
            font-size: 12px;
            width: 120px;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-strong);
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">🤚</div>
                    <span class="logo-text">OpenHands</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-group">
                    <div class="nav-group-title">对话</div>
                    <div class="nav-item active" data-tab="chat">
                        <span class="nav-icon">💬</span>
                        <span>聊天</span>
                    </div>
                </div>
                
                <div class="nav-group">
                    <div class="nav-group-title">控制</div>
                    <div class="nav-item" data-tab="overview">
                        <span class="nav-icon">📊</span>
                        <span>概览</span>
                    </div>
                    <div class="nav-item" data-tab="channels">
                        <span class="nav-icon">🔗</span>
                        <span>渠道</span>
                    </div>
                    <div class="nav-item" data-tab="instances">
                        <span class="nav-icon">📡</span>
                        <span>实例</span>
                    </div>
                    <div class="nav-item" data-tab="sessions">
                        <span class="nav-icon">📄</span>
                        <span>会话</span>
                    </div>
                    <div class="nav-item" data-tab="usage">
                        <span class="nav-icon">📈</span>
                        <span>用量</span>
                    </div>
                    <div class="nav-item" data-tab="cron">
                        <span class="nav-icon">⏰</span>
                        <span>定时任务</span>
                    </div>
                </div>
                
                <div class="nav-group">
                    <div class="nav-group-title">智能体</div>
                    <div class="nav-item" data-tab="agents">
                        <span class="nav-icon">📁</span>
                        <span>智能体管理</span>
                    </div>
                    <div class="nav-item" data-tab="skills">
                        <span class="nav-icon">⚡</span>
                        <span>技能</span>
                    </div>
                    <div class="nav-item" data-tab="nodes">
                        <span class="nav-icon">🖥️</span>
                        <span>节点</span>
                    </div>
                    <div class="nav-item" data-tab="dreams">
                        <span class="nav-icon">🌙</span>
                        <span>学习反思</span>
                    </div>
                </div>
                
                <div class="nav-group">
                    <div class="nav-group-title">设置</div>
                    <div class="nav-item" data-tab="config">
                        <span class="nav-icon">⚙️</span>
                        <span>配置</span>
                    </div>
                    <div class="nav-item" data-tab="appearance">
                        <span class="nav-icon">✨</span>
                        <span>外观</span>
                    </div>
                    <div class="nav-item" data-tab="automation">
                        <span class="nav-icon">🔧</span>
                        <span>自动化</span>
                    </div>
                    <div class="nav-item" data-tab="logs">
                        <span class="nav-icon">📜</span>
                        <span>日志</span>
                    </div>
                </div>
            </nav>
        </div>
        
        <!-- Main Content -->
        <div class="main">
            <div class="header">
                <div class="header-left">
                    <h1 class="page-title">聊天</h1>
                    <div class="connection-status connected" id="connectionStatus">
                        <span class="status-dot"></span>
                        <span>已连接</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-ghost" onclick="clearChat()">🗑️ 清空</button>
                    <button class="btn btn-primary" onclick="takeControl()">🎮 接管</button>
                </div>
            </div>
            
            <div class="chat-container">
                <div class="chat-thread" id="chatThread">
                    <div class="welcome" id="welcomeScreen">
                        <div class="welcome-icon">🤚</div>
                        <h2>欢迎使用 OpenHands</h2>
                        <p>我是您的 AI 智能助手，可以帮助您操作电脑、管理文件、执行命令等。请输入您的需求开始对话。</p>
                    </div>
                </div>
                
                <div class="compose">
                    <div class="compose-box">
                        <div class="compose-field">
                            <textarea 
                                class="compose-input" 
                                id="messageInput" 
                                placeholder="输入消息... (Enter 发送，Shift+Enter 换行)"
                                rows="1"
                            ></textarea>
                        </div>
                        <div class="compose-actions">
                            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                                发送 ➤
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Right Panel -->
        <div class="right-panel">
            <div class="panel-tabs">
                <div class="panel-tab active" data-panel="stats">统计</div>
                <div class="panel-tab" data-panel="activity">活动</div>
                <div class="panel-tab" data-panel="settings">设置</div>
            </div>
            
            <div class="panel-content" id="panelContent">
                <div id="statsPanel">
                    <div class="stat-card">
                        <div class="stat-label">工具调用次数</div>
                        <div class="stat-value" id="toolCallCount">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">消息数量</div>
                        <div class="stat-value" id="messageCount">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">会话时长</div>
                        <div class="stat-value" id="sessionDuration">00:00</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">当前模型</div>
                        <div class="stat-value" style="font-size: 14px;" id="currentModel">LongCat-2.0</div>
                    </div>
                </div>
                
                <div id="activityPanel" style="display: none;">
                    <div id="activityList"></div>
                </div>
                
                <div id="settingsPanel" style="display: none;">
                    <div class="settings-group">
                        <div class="settings-title">API 配置</div>
                        <div class="settings-item">
                            <span class="settings-label">API 密钥</span>
                            <input type="password" class="settings-input" placeholder="sk-...">
                        </div>
                        <div class="settings-item">
                            <span class="settings-label">模型</span>
                            <select class="settings-input">
                                <option value="LongCat-2.0-Preview">LongCat-2.0</option>
                                <option value="claude-3-5-sonnet">Claude 3.5</option>
                                <option value="gpt-4o">GPT-4o</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let messageCount = 0;
        let toolCallCount = 0;
        let sessionStartTime = Date.now();
        let activities = [];
        
        // Initialize WebSocket
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            updateConnectionStatus('connecting');
            addActivity('系统', '正在连接服务器...', '🔗');
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = () => {
                updateConnectionStatus('connected');
                addActivity('系统', '已连接', '✅');
                document.getElementById('sendBtn').disabled = false;
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket 错误:', error);
                updateConnectionStatus('disconnected');
                addActivity('系统', '连接错误', '❌');
            };
            
            ws.onclose = () => {
                updateConnectionStatus('disconnected');
                addActivity('系统', '连接已断开', '⚠️');
                document.getElementById('sendBtn').disabled = true;
                setTimeout(initWebSocket, 5000);
            };
        }
        
        // Update connection status
        function updateConnectionStatus(status) {
            const statusEl = document.getElementById('connectionStatus');
            if (status === 'connected') {
                statusEl.className = 'connection-status connected';
                statusEl.innerHTML = '<span class="status-dot"></span><span>已连接</span>';
            } else if (status === 'connecting') {
                statusEl.innerHTML = '<span class="status-dot"></span><span>连接中...</span>';
            } else {
                statusEl.className = 'connection-status disconnected';
                statusEl.innerHTML = '<span class="status-dot"></span><span>未连接</span>';
            }
        }
        
        // Handle messages
        function handleMessage(data) {
            switch (data.type) {
                case 'message':
                    addMessage('assistant', data.content);
                    break;
                case 'status':
                    showStatus(data.content);
                    break;
                case 'tool_call':
                    showToolCall(data.tool, data.arguments);
                    toolCallCount++;
                    updateStats();
                    break;
                case 'tool_result':
                    showToolResult(data.tool, data.result, data.is_error);
                    break;
                case 'error':
                    addMessage('assistant', '❌ ' + data.content, true);
                    break;
            }
        }
        
        // Add message
        function addMessage(role, content, isError = false) {
            const thread = document.getElementById('chatThread');
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();
            
            const typing = thread.querySelector('.typing');
            if (typing) typing.remove();
            
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            const avatar = role === 'user' ? '👤' : '🤖';
            const name = role === 'user' ? '您' : 'OpenHands';
            
            const messageEl = document.createElement('div');
            messageEl.className = `message ${role}`;
            messageEl.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-name">${name}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-text" style="${isError ? 'color: var(--danger);' : ''}">${formatContent(content)}</div>
                </div>
            `;
            
            thread.appendChild(messageEl);
            thread.scrollTop = thread.scrollHeight;
            
            messageCount++;
            updateStats();
            addActivity(name, content.substring(0, 40) + (content.length > 40 ? '...' : ''), avatar);
        }
        
        // Format content
        function formatContent(content) {
            return content
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
        }
        
        // Show status
        function showStatus(status) {
            const thread = document.getElementById('chatThread');
            const oldStatus = thread.querySelector('.status-message');
            if (oldStatus) oldStatus.remove();
            
            const statusEl = document.createElement('div');
            statusEl.className = 'status-message';
            statusEl.style.cssText = 'text-align: center; padding: 10px; color: var(--muted); font-size: 13px;';
            statusEl.textContent = status;
            
            thread.appendChild(statusEl);
            thread.scrollTop = thread.scrollHeight;
        }
        
        // Show tool call
        function showToolCall(tool, args) {
            const thread = document.getElementById('chatThread');
            
            const toolEl = document.createElement('div');
            toolEl.className = 'tool-card';
            toolEl.innerHTML = `
                <div class="tool-header" onclick="toggleTool(this)">
                    <div class="tool-icon">🔧</div>
                    <span class="tool-name">${tool}</span>
                    <span class="tool-status running">执行中...</span>
                </div>
                <div class="tool-body">
                    <div><strong>参数:</strong> ${JSON.stringify(args)}</div>
                </div>
            `;
            
            thread.appendChild(toolEl);
            thread.scrollTop = thread.scrollHeight;
        }
        
        // Show tool result
        function showToolResult(tool, result, isError) {
            const thread = document.getElementById('chatThread');
            const toolCards = thread.querySelectorAll('.tool-card');
            
            if (toolCards.length > 0) {
                const lastCard = toolCards[toolCards.length - 1];
                const statusEl = lastCard.querySelector('.tool-status');
                const bodyEl = lastCard.querySelector('.tool-body');
                
                statusEl.className = `tool-status ${isError ? 'error' : 'success'}`;
                statusEl.textContent = isError ? '失败' : '成功';
                
                const resultEl = document.createElement('div');
                resultEl.className = 'tool-result';
                resultEl.innerHTML = `<strong>结果:</strong><br>${result}`;
                bodyEl.appendChild(resultEl);
            }
        }
        
        // Toggle tool
        function toggleTool(header) {
            header.parentElement.classList.toggle('expanded');
        }
        
        // Send message
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('未连接到服务器，请稍候...');
                return;
            }
            
            addMessage('user', content);
            input.value = '';
            input.style.height = 'auto';
            
            ws.send(JSON.stringify({
                type: 'message',
                content: content
            }));
            
            showTyping();
        }
        
        // Show typing indicator
        function showTyping() {
            const thread = document.getElementById('chatThread');
            const typingEl = document.createElement('div');
            typingEl.className = 'message assistant';
            typingEl.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="typing">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            thread.appendChild(typingEl);
            thread.scrollTop = thread.scrollHeight;
        }
        
        // Clear chat
        function clearChat() {
            const thread = document.getElementById('chatThread');
            thread.innerHTML = `
                <div class="welcome">
                    <div class="welcome-icon">🤚</div>
                    <h2>欢迎使用 OpenHands</h2>
                    <p>我是您的 AI 智能助手，可以帮助您操作电脑、管理文件、执行命令等。请输入您的需求开始对话。</p>
                </div>
            `;
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'clear' }));
            }
            
            messageCount = 0;
            toolCallCount = 0;
            updateStats();
        }
        
        // Take control
        function takeControl() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'take_control' }));
                addActivity('系统', '已请求接管控制', '🎮');
            }
        }
        
        // Update stats
        function updateStats() {
            document.getElementById('toolCallCount').textContent = toolCallCount;
            document.getElementById('messageCount').textContent = messageCount;
        }
        
        // Add activity
        function addActivity(title, desc, icon) {
            const list = document.getElementById('activityList');
            const time = new Date().toLocaleTimeString('zh-CN');
            
            activities.unshift({ title, desc, icon, time });
            if (activities.length > 50) activities.pop();
            
            const el = document.createElement('div');
            el.className = 'activity-item';
            el.innerHTML = `
                <div class="activity-icon">${icon}</div>
                <div class="activity-content">
                    <div class="activity-title">${title}</div>
                    <div class="activity-time">${time} - ${desc}</div>
                </div>
            `;
            
            list.insertBefore(el, list.firstChild);
            while (list.children.length > 20) {
                list.removeChild(list.lastChild);
            }
        }
        
        // Update duration
        function updateSessionDuration() {
            const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('sessionDuration').textContent = `${minutes}:${seconds}`;
        }
        
        // Panel tabs
        document.querySelectorAll('.panel-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                
                const panel = tab.dataset.panel;
                document.getElementById('statsPanel').style.display = panel === 'stats' ? 'block' : 'none';
                document.getElementById('activityPanel').style.display = panel === 'activity' ? 'block' : 'none';
                document.getElementById('settingsPanel').style.display = panel === 'settings' ? 'block' : 'none';
            });
        });
        
        // Nav items
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                document.querySelector('.page-title').textContent = item.querySelector('span:last-child').textContent;
            });
        });
        
        // Input events
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });
        
        // Initialize
        initWebSocket();
        setInterval(updateSessionDuration, 1000);
    </script>
</body>
</html>
