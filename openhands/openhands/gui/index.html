<!DOCTYPE html>
<html lang="zh-CN" data-theme-mode="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenHands - AI Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0e1015;
            --bg-accent: #13151b;
            --bg-elevated: #191c24;
            --bg-hover: #1f2330;
            --card: #161920;
            --text: #d4d4d8;
            --text-strong: #f4f4f5;
            --muted: #838387;
            --border: #1e2028;
            --border-strong: #2e3040;
            --accent: #ff5c5c;
            --accent-hover: #ff7070;
            --accent-subtle: rgba(255, 92, 92, 0.1);
            --ok: #22c55e;
            --warn: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --radius: 10px;
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 999px;
            --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: "JetBrains Mono", ui-monospace, monospace;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        
        .app {
            display: flex;
            height: 100vh;
        }
        
        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--bg-accent);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #ff7070);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(255, 92, 92, 0.3);
        }
        
        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-strong);
        }
        
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
        }
        
        .nav-group { margin-bottom: 8px; }
        
        .nav-group-title {
            padding: 8px 12px 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text);
            font-size: 14px;
            border-left: 3px solid transparent;
            margin: 2px 0;
            transition: all 0.15s ease;
        }
        
        .nav-item:hover { background: var(--bg-hover); }
        
        .nav-item.active {
            background: var(--accent-subtle);
            border-left-color: var(--accent);
            color: var(--accent);
        }
        
        .nav-icon { width: 20px; text-align: center; }
        
        /* Main */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: var(--bg-accent);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .header-left { display: flex; align-items: center; gap: 12px; }
        
        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-strong);
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 500;
        }
        
        .connection-status.connected {
            background: rgba(34, 197, 94, 0.1);
            color: var(--ok);
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 12px rgba(255, 92, 92, 0.3);
        }
        
        .btn-ghost {
            background: transparent;
            color: var(--text);
        }
        
        .btn-ghost:hover { background: var(--bg-hover); }
        
        /* Chat */
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: transparent;
        }
        
        .chat-thread {
            flex: 1;
            overflow-y: auto;
            padding: 0 6px 6px;
            min-height: 0;
        }
        
        /* Welcome - OpenClaw Style */
        .agent-chat__welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 60px 24px;
            position: relative;
        }
        
        .agent-chat__welcome-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent-subtle) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        .agent-chat__avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: linear-gradient(135deg, var(--accent), #ff7070);
            box-shadow: 0 4px 20px rgba(255, 92, 92, 0.4);
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }
        
        .agent-chat__welcome h2 {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-strong);
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }
        
        .agent-chat__badges {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }
        
        .agent-chat__badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            padding: 6px 14px;
        }
        
        .agent-chat__hint {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }
        
        .agent-chat__hint kbd {
            display: inline-block;
            padding: 2px 8px;
            font-size: 11px;
            font-family: var(--font-mono);
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        
        .agent-chat__suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 600px;
            position: relative;
            z-index: 1;
        }
        
        .agent-chat__suggestion {
            font-size: 13px;
            padding: 10px 18px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .agent-chat__suggestion:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }
        
        /* Messages */
        .message {
            display: flex;
            gap: 12px;
            margin: 16px 0;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        
        .message.user .message-avatar { background: var(--accent); }
        .message.assistant .message-avatar { background: linear-gradient(135deg, var(--ok), #16a34a); }
        
        .message-content { flex: 1; min-width: 0; }
        
        .message-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 6px;
        }
        
        .message-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-strong);
        }
        
        .message-time {
            font-size: 11px;
            color: var(--muted);
        }
        
        /* Chat text - OpenClaw style */
        .chat-text {
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .chat-text p { margin: 0 0 0.5em; }
        .chat-text p:last-child { margin-bottom: 0; }
        
        .chat-text code {
            font-family: var(--font-mono);
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.15);
            padding: 0.15em 0.4em;
            border-radius: var(--radius-sm);
        }
        
        .chat-text pre {
            background: rgba(0, 0, 0, 0.15);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            overflow-x: auto;
            margin: 0.75em 0;
        }
        
        .chat-text pre code {
            background: transparent;
            padding: 0;
        }
        
        .message.streaming .chat-text {
            border-right: 2px solid var(--accent);
            animation: blink 1s step-end infinite;
        }
        
        @keyframes blink {
            50% { border-color: transparent; }
        }
        
        /* Thinking - OpenClaw style */
        .chat-thinking {
            margin-bottom: 10px;
            padding: 10px 12px;
            border-radius: var(--radius-md);
            border: 1px dashed rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.04);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
            font-family: var(--font-mono);
        }
        
        /* Tool cards - OpenClaw style */
        .tool-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            margin: 16px 0;
            overflow: hidden;
        }
        
        .tool-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
        }
        
        .tool-header:hover { background: var(--bg-hover); }
        
        .tool-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), #ff7070);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        
        .tool-info { flex: 1; }
        
        .tool-name {
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font-mono);
            color: var(--text-strong);
        }
        
        .tool-args {
            font-size: 12px;
            color: var(--muted);
        }
        
        .tool-status {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: var(--radius-full);
        }
        
        .tool-status.running { background: rgba(59, 130, 246, 0.2); color: var(--info); }
        .tool-status.success { background: rgba(34, 197, 94, 0.2); color: var(--ok); }
        .tool-status.error { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        
        .tool-body {
            padding: 0 16px 16px;
            display: none;
        }
        
        .tool-card.expanded .tool-body { display: block; }
        
        .tool-result {
            background: rgba(0, 0, 0, 0.15);
            border-radius: var(--radius-sm);
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text);
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        
        /* Compose */
        .compose {
            flex-shrink: 0;
            padding: 12px;
            background: var(--bg);
        }
        
        .compose-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
        }
        
        .compose-box:focus-within {
            border-color: var(--border-strong);
            box-shadow: 0 0 0 3px rgba(255, 92, 92, 0.1);
        }
        
        .compose-input {
            width: 100%;
            padding: 14px 16px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 14px;
            font-family: var(--font-body);
            line-height: 1.5;
            resize: none;
            outline: none;
            min-height: 48px;
            max-height: 150px;
        }
        
        .compose-input::placeholder { color: var(--muted); }
        
        .compose-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-top: 1px solid var(--border);
        }
        
        .send-btn {
            padding: 0 20px;
            height: 36px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.15s ease;
        }
        
        .send-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }
        
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Right panel */
        .right-panel {
            width: 280px;
            background: var(--bg-accent);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }
        
        .panel-tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        
        .panel-tab:hover { color: var(--text); background: var(--bg-hover); }
        .panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .panel-view { display: none; }
        .panel-view.active { display: block; }
        
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .stat-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-strong);
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">🤚</div>
                    <span class="logo-text">OpenHands</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-group">
                    <div class="nav-group-title">对话</div>
                    <div class="nav-item active">
                        <span class="nav-icon">💬</span>
                        <span>聊天</span>
                    </div>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">工具</div>
                    <div class="nav-item"><span class="nav-icon">🖥️</span><span>终端</span></div>
                    <div class="nav-item"><span class="nav-icon">📁</span><span>文件</span></div>
                    <div class="nav-item"><span class="nav-icon">🧠</span><span>记忆</span></div>
                </div>
                <div class="nav-group">
                    <div class="nav-group-title">设置</div>
                    <div class="nav-item"><span class="nav-icon">⚙️</span><span>配置</span></div>
                </div>
            </nav>
        </div>
        
        <div class="main">
            <div class="header">
                <div class="header-left">
                    <h1 class="page-title">聊天</h1>
                    <div class="connection-status connected" id="connectionStatus">
                        <span class="status-dot"></span>
                        <span>已连接</span>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-ghost" onclick="clearChat()">🗑️ 清空</button>
                    <button class="btn btn-primary" onclick="newSession()">✨ 新会话</button>
                </div>
            </div>
            
            <div class="chat">
                <div class="chat-thread" id="chatThread">
                    <div class="agent-chat__welcome" id="welcomeScreen">
                        <div class="agent-chat__welcome-glow"></div>
                        <div class="agent-chat__avatar">🤚</div>
                        <h2>OpenHands</h2>
                        <div class="agent-chat__badges">
                            <span class="agent-chat__badge">🟢 Ready to chat</span>
                        </div>
                        <p class="agent-chat__hint">输入消息开始对话 · 按 <kbd>/</kbd> 使用命令</p>
                        <div class="agent-chat__suggestions">
                            <button class="agent-chat__suggestion" onclick="sendSuggestion('你好')">你好</button>
                            <button class="agent-chat__suggestion" onclick="sendSuggestion('执行 pwd')">执行 pwd</button>
                            <button class="agent-chat__suggestion" onclick="sendSuggestion('列出当前目录')">列出目录</button>
                            <button class="agent-chat__suggestion" onclick="sendSuggestion('你能做什么？')">你能做什么？</button>
                        </div>
                    </div>
                </div>
                
                <div class="compose">
                    <div class="compose-box">
                        <textarea class="compose-input" id="messageInput" placeholder="输入消息..." rows="1"></textarea>
                        <div class="compose-actions">
                            <span style="font-size: 12px; color: var(--muted);">LongCat-2.0</span>
                            <button class="send-btn" id="sendBtn" onclick="sendMessage()">发送 ➤</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="right-panel">
            <div class="panel-tabs">
                <div class="panel-tab active" onclick="switchTab('stats')">统计</div>
                <div class="panel-tab" onclick="switchTab('info')">信息</div>
            </div>
            <div class="panel-content">
                <div class="panel-view active" id="statsPanel">
                    <div class="stat-card">
                        <div class="stat-label">工具调用</div>
                        <div class="stat-value" id="toolCallCount">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">消息数</div>
                        <div class="stat-value" id="messageCount">0</div>
                    </div>
                </div>
                <div class="panel-view" id="infoPanel">
                    <div class="stat-card">
                        <div class="stat-label">模型</div>
                        <div style="font-size: 14px; color: var(--text); margin-top: 4px;">LongCat-2.0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">状态</div>
                        <div style="font-size: 14px; color: var(--ok); margin-top: 4px;">✓ 已连接</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let messageCount = 0;
        let toolCallCount = 0;
        let isStreaming = false;
        
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            
            ws.onopen = () => {
                document.getElementById('connectionStatus').innerHTML = '<span class="status-dot"></span><span>已连接</span>';
                document.getElementById('connectionStatus').className = 'connection-status connected';
                document.getElementById('sendBtn').disabled = false;
            };
            
            ws.onmessage = (event) => {
                handleMessage(JSON.parse(event.data));
            };
            
            ws.onerror = () => {
                document.getElementById('connectionStatus').innerHTML = '<span class="status-dot"></span><span>连接错误</span>';
            };
            
            ws.onclose = () => {
                document.getElementById('connectionStatus').innerHTML = '<span class="status-dot"></span><span>未连接</span>';
                setTimeout(initWebSocket, 3000);
            };
        }
        
        function handleMessage(data) {
            switch (data.type) {
                case 'stream':
                    updateStreamMessage(data.content);
                    break;
                case 'thinking':
                    showThinking(data.content);
                    break;
                case 'message':
                    finalizeStreamMessage(data.content);
                    break;
                case 'tool_call':
                    showToolCall(data.tool, data.arguments);
                    toolCallCount++;
                    updateStats();
                    break;
                case 'tool_result':
                    showToolResult(data.tool, data.result, data.is_error);
                    break;
                case 'error':
                    finalizeStreamMessage('❌ ' + data.content, true);
                    break;
            }
        }
        
        function showThinking(content) {
            const thread = document.getElementById('chatThread');
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();
            
            let panel = thread.querySelector('.chat-thinking');
            if (!panel) {
                panel = document.createElement('div');
                panel.className = 'chat-thinking';
                panel.textContent = content;
                thread.appendChild(panel);
            } else {
                panel.textContent = content;
            }
            thread.scrollTop = thread.scrollHeight;
        }
        
        function updateStreamMessage(text) {
            const thread = document.getElementById('chatThread');
            
            const panel = thread.querySelector('.chat-thinking');
            if (panel) panel.remove();
            
            let msg = thread.querySelector('.message.streaming');
            if (!msg) {
                msg = document.createElement('div');
                msg.className = 'message assistant streaming';
                msg.innerHTML = `
                    <div class="message-avatar">🤖</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-name">OpenHands</span>
                            <span class="message-time">${new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'})}</span>
                        </div>
                        <div class="chat-text"></div>
                    </div>
                `;
                thread.appendChild(msg);
            }
            
            msg.querySelector('.chat-text').innerHTML = formatContent(text);
            thread.scrollTop = thread.scrollHeight;
        }
        
        function finalizeStreamMessage(text, isError = false) {
            const thread = document.getElementById('chatThread');
            const msg = thread.querySelector('.message.streaming');
            
            if (msg) {
                msg.classList.remove('streaming');
                msg.querySelector('.chat-text').innerHTML = formatContent(text);
            }
            
            const panel = thread.querySelector('.chat-thinking');
            if (panel) panel.remove();
            
            messageCount++;
            updateStats();
            isStreaming = false;
        }
        
        function addMessage(role, content) {
            const thread = document.getElementById('chatThread');
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();
            
            const panel = thread.querySelector('.chat-thinking');
            if (panel) panel.remove();
            
            const time = new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
            const avatar = role === 'user' ? '👤' : '🤖';
            const name = role === 'user' ? '你' : 'OpenHands';
            
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-name">${name}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="chat-text">${formatContent(content)}</div>
                </div>
            `;
            
            thread.appendChild(msg);
            thread.scrollTop = thread.scrollHeight;
            messageCount++;
            updateStats();
        }
        
        function formatContent(content) {
            if (!content) return '';
            let html = content
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            return '<p>' + html.replace(/<br>/g, '</p><p>') + '</p>';
        }
        
        function showToolCall(tool, args) {
            const thread = document.getElementById('chatThread');
            
            const panel = thread.querySelector('.chat-thinking');
            if (panel) panel.remove();
            
            const card = document.createElement('div');
            card.className = 'tool-card';
            card.innerHTML = `
                <div class="tool-header" onclick="this.parentElement.classList.toggle('expanded')">
                    <div class="tool-icon">🔧</div>
                    <div class="tool-info">
                        <div class="tool-name">${tool}</div>
                        <div class="tool-args">${args ? JSON.stringify(args).substring(0,60) : '执行中...'}</div>
                    </div>
                    <span class="tool-status running">执行中...</span>
                </div>
                <div class="tool-body">
                    <div class="tool-result">等待结果...</div>
                </div>
            `;
            
            thread.appendChild(card);
            thread.scrollTop = thread.scrollHeight;
        }
        
        function showToolResult(tool, result, isError) {
            const thread = document.getElementById('chatThread');
            const cards = thread.querySelectorAll('.tool-card');
            
            if (cards.length > 0) {
                const last = cards[cards.length - 1];
                last.querySelector('.tool-status').className = `tool-status ${isError ? 'error' : 'success'}`;
                last.querySelector('.tool-status').textContent = isError ? '失败' : '成功';
                const resultEl = last.querySelector('.tool-result');
                resultEl.className = `tool-result ${isError ? 'error' : ''}`;
                resultEl.textContent = result || '无输出';
                last.classList.add('expanded');
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            
            addMessage('user', content);
            input.value = '';
            input.style.height = 'auto';
            
            isStreaming = true;
            ws.send(JSON.stringify({type: 'message', content}));
        }
        
        function sendSuggestion(text) {
            document.getElementById('messageInput').value = text;
            sendMessage();
        }
        
        function clearChat() {
            location.reload();
        }
        
        function newSession() {
            location.reload();
        }
        
        function updateStats() {
            document.getElementById('toolCallCount').textContent = toolCallCount;
            document.getElementById('messageCount').textContent = messageCount;
        }
        
        function switchTab(tab) {
            document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel-view').forEach(v => v.classList.remove('active'));
            document.querySelector(`.panel-tab:nth-child(${tab === 'stats' ? 1 : 2})`).classList.add('active');
            document.getElementById(`${tab}Panel`).classList.add('active');
        }
        
        document.getElementById('messageInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        document.getElementById('messageInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });
        
        initWebSocket();
    </script>
</body>
</html>
