[project]
name = "auroraagent"
version = "0.1.0"
description = "AuroraAgent - AI Assistant with Windows Control"
authors = [{name = "Aurora Team"}]
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pyautogui>=0.9.54",
    "pynput>=1.7.7",
    "mss>=9.0.1",
    "Pillow>=10.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "aiofiles>=23.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "click>=8.0.0",
    "apscheduler>=3.10.0",
    "python-docx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
browser = [
    "playwright>=1.40.0",
]
voice = [
    "gTTS>=2.4.0",
    "SpeechRecognition>=3.10.0",
]
sandbox = [
    "docker>=7.0.0",
]
media = [
    "diffusers>=0.25.0",
    "torch>=2.0.0",
]
all = [
    "auroraagent[dev,browser,voice,sandbox,media]",
]

[project.scripts]
aurora = "auroraagent.cli.main:main"
aurora-gui = "auroraagent.gui.server:run_gui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auroraagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]
